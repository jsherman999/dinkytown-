<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dinkytown Through Time</title>
    <meta name="description" content="A slightly-3D historical map of Dinkytown, Minneapolis, with a year slider from 1885 to today." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='6' width='12' height='8' fill='%23b5644a'/><rect x='5' y='2' width='6' height='5' fill='%23d9b57a'/></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>Dinkytown Through Time</h1>
        <div id="year-badge" aria-live="polite">1950</div>
        <button id="about-btn" type="button" aria-expanded="false">About &amp; legend</button>
      </header>
      <div id="map" role="application" aria-label="Map of Dinkytown"></div>
      <aside id="panel" hidden aria-label="Building details"></aside>
      <section id="about" hidden></section>
      <footer id="controls">
        <button id="prev-kf" type="button" title="Previous saved view (←)">◀</button>
        <div id="slider-wrap">
          <div id="ticks" aria-hidden="true"></div>
          <input id="slider" type="range" min="1885" max="2026" step="1" value="1950" aria-label="Year" />
        </div>
        <button id="next-kf" type="button" title="Next saved view (→)">▶</button>
        <input id="year-input" type="number" min="1885" max="2026" step="1" value="1950" aria-label="Year (type a year)" />
        <label id="snap-label"><input id="snap" type="checkbox" checked /> snap to saved views</label>
        <button id="play" type="button" title="Play through the years">Play</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
